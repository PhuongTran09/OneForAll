version: "3.9"

services:
  web:
    build: .
    container_name: oneforall_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OneForAll
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/oneforall_db
      - SECRET_KEY=dev-secret-key-change-in-production-123456789
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: oneforall_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oneforall_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneforall_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
