version: "3.9"

# Windows: defaults keep OneForAll's temporary files and Redis data on drive D:.
# Override ONEFORALL_TEMP_DIR / ONEFORALL_REDIS_DIR in .env if needed.
x-worker-base: &worker-base
  build: .
  volumes:
    - .:/app
    - type: bind
      source: ${ONEFORALL_TEMP_DIR:-D:/OneForAll/temp}
      target: /tmp/oneforall
      bind:
        create_host_path: true
  environment:
    - APP_NAME=OneForAll
    - APP_ENV=development
    - DEBUG=True
    - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
    - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
    - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/1
  depends_on:
    redis:
      condition: service_started

services:
  web:
    build: .
    container_name: oneforall_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - type: bind
        source: ${ONEFORALL_TEMP_DIR:-D:/OneForAll/temp}
        target: /tmp/oneforall
        bind:
          create_host_path: true
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OneForAll
      - APP_ENV=development
      - DEBUG=True
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_started

  # Convert Worker: LibreOffice & VTracer
  worker_convert:
    <<: *worker-base
    container_name: oneforall_worker_convert
    command: celery -A app.worker.celery_app worker -Q convert -n worker_convert@%h --loglevel=INFO --concurrency=2

  # Image Worker: Pillow operations
  worker_image:
    <<: *worker-base
    container_name: oneforall_worker_image
    command: celery -A app.worker.celery_app worker -Q image -n worker_image@%h --loglevel=INFO --concurrency=4

  # Video Worker: FFmpeg & yt-dlp
  worker_video:
    <<: *worker-base
    container_name: oneforall_worker_video
    command: celery -A app.worker.celery_app worker -Q video -n worker_video@%h --loglevel=INFO --concurrency=1

  # GPU Worker: BiRefNet; enable GPU passthrough only after NVIDIA Container Toolkit is configured.
  worker_gpu:
    <<: *worker-base
    container_name: oneforall_worker_gpu
    command: celery -A app.worker.celery_app worker -Q gpu -n worker_gpu@%h --loglevel=INFO --concurrency=1 -P solo
    environment:
      - APP_NAME=OneForAll
      - APP_ENV=development
      - DEBUG=True
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MODEL_DEVICE=cuda
    # Uncomment when NVIDIA Container Toolkit is enabled on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Scheduled cleanup tasks
  beat:
    <<: *worker-base
    container_name: oneforall_beat
    command: celery -A app.worker.celery_app beat --loglevel=INFO

  redis:
    image: redis:7-alpine
    container_name: oneforall_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - type: bind
        source: ${ONEFORALL_REDIS_DIR:-D:/OneForAll/data/redis}
        target: /data
        bind:
          create_host_path: true
    ports:
      - "127.0.0.1:6379:6379"
