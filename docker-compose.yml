version: "3.9"

x-worker-base: &worker-base
  build: .
  volumes:
    - .:/app
  environment:
    - APP_NAME=OneForAll
    - APP_ENV=development
    - DEBUG=True
    - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
    - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
    - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/1
  depends_on:
    redis:
      condition: service_started

services:
  web:
    build: .
    container_name: oneforall_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OneForAll
      - APP_ENV=development
      - DEBUG=True
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_started

  # 1. Convert Worker: LibreOffice & VTracer (CPU/Memory bound)
  worker_convert:
    <<: *worker-base
    container_name: oneforall_worker_convert
    command: celery -A app.workers worker -Q convert -n worker_convert@%h --loglevel=INFO --concurrency=2

  # 2. Image Worker: Pillow operations (I/O & CPU light, high concurrency)
  worker_image:
    <<: *worker-base
    container_name: oneforall_worker_image
    command: celery -A app.workers worker -Q image -n worker_image@%h --loglevel=INFO --concurrency=4

  # 3. Video Worker: FFmpeg & yt-dlp (CPU & Disk I/O intensive)
  worker_video:
    <<: *worker-base
    container_name: oneforall_worker_video
    command: celery -A app.workers worker -Q video -n worker_video@%h --loglevel=INFO --concurrency=1

  # 4. GPU Worker: BiRefNet background removal & AI models (VRAM intensive)
  worker_gpu:
    <<: *worker-base
    container_name: oneforall_worker_gpu
    command: celery -A app.workers worker -Q gpu -n worker_gpu@%h --loglevel=INFO --concurrency=1 -P solo
    environment:
      - APP_NAME=OneForAll
      - APP_ENV=development
      - DEBUG=True
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-supabase-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-supabase-service-role-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MODEL_DEVICE=cuda
    # Uncomment when NVIDIA Container Toolkit is enabled on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 5. Beat Worker: Scheduled tasks (e.g., cleanup expired files every 1 min)
  beat:
    <<: *worker-base
    container_name: oneforall_beat
    command: celery -A app.workers beat --loglevel=INFO

  redis:
    image: redis:7-alpine
    container_name: oneforall_redis
    restart: always
    ports:
      - "6379:6379"
