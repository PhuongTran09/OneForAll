[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneforall"
version = "0.1.0"
description = "OneForAll - FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "supabase>=2.32.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dotenv>=1.0.1",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP046", "B008"]

